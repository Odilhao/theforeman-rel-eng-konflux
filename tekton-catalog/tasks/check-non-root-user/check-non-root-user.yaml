---
# Foreman custom task: verifies a built image is not configured to run as root.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-non-root-user
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: image-build, verification
spec:
  description: |-
    Inspects a built image's config and fails if it is configured to run as root
    (User is unset, "0", or "root", including "uid:gid" forms like "0:1000").
    Optionally enforces a specific expected user.
  params:
    - name: IMAGE_URL
      type: string
      description: Reference of the image to inspect (tag or digest form, e.g. quay.io/org/image:tag or quay.io/org/image@sha256:...)
    - name: IMAGE_DIGEST
      type: string
      description: If set, IMAGE_URL's tag (if any) is replaced with this digest before inspecting — containers/image rejects references with both a tag and a digest.
      default: ""
    - name: ALLOWED_USER
      type: string
      description: If set, the image's configured user (the part before ":" in a "uid:gid" value) must match this value exactly.
      default: ""
  steps:
    - name: check-non-root-user
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 50m
      env:
        - name: "IMAGE_URL"
          value: "$(params.IMAGE_URL)"
        - name: "IMAGE_DIGEST"
          value: "$(params.IMAGE_DIGEST)"
        - name: "ALLOWED_USER"
          value: "$(params.ALLOWED_USER)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        IMAGE_REF="${IMAGE_URL}"
        if [ -n "${IMAGE_DIGEST}" ]; then
          IMAGE_REF="${IMAGE_URL%%:*}@${IMAGE_DIGEST}"
        fi

        USER_VAL=$(skopeo inspect --config "docker://${IMAGE_REF}" | jq -r '.config.User // empty')
        USER_PART="${USER_VAL%%:*}"

        if [ -z "$USER_PART" ] || [ "$USER_PART" = "0" ] || [ "$USER_PART" = "root" ]; then
          echo "ERROR: Image is configured to run as root (User='${USER_VAL:-unset}')"
          echo "Add a USER directive with a non-root numeric UID to your Dockerfile."
          exit 1
        fi

        if [ -n "$ALLOWED_USER" ] && [ "$USER_PART" != "$ALLOWED_USER" ]; then
          echo "ERROR: Image user '${USER_VAL}' does not match required user '${ALLOWED_USER}'"
          exit 1
        fi

        echo "OK: Image user is set to '${USER_VAL}'"
