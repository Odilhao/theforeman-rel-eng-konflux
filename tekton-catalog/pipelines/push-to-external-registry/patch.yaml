---
# JSON 6902 patch for the push-to-external-registry pipeline.
#
# Upstream pipeline params (0-based indices used below):
#   0: release
#   1: releasePlan
#   2: releasePlanAdmission   ← removed (no RPA on Fedora cluster)
#   3: releaseServiceConfig   ← removed (no RPA on Fedora cluster)
#   4: snapshot
#   5: enterpriseContractPolicy
#   6: enterpriseContractExtraRuleData
#   7: verify_ec_task_git_revision
#   8: taskGitUrl
#   9: taskGitRevision
#  10: ociStorage
#
# Upstream pipeline tasks (0-based indices used below):
#   0: verify-access-to-resources  ← removed entirely (requires RPA/RSC)
#   1: collect-data
#   ...
#
# Operations are ordered so that:
#   1. Default-setting ops run before pipeline param removes (index shifts).
#   2. collect-data param removes (tasks/1) run before removing tasks/0,
#      so that tasks/1 still refers to collect-data at that point.
#   3. verify-access-to-resources (tasks/0) is removed last.

# Use our trusted-artifacts storage
- op: replace
  path: /spec/params/10/default
  value: quay.io/foreman/konflux-ci/trusted-artifacts

# Tasks must match the development branch since the pipeline is sourced from there
- op: add
  path: /spec/params/9/default
  value: development

# Pin the EC/conforma task to main
- op: add
  path: /spec/params/7/default
  value: main

# Default EC policy for the Fedora cluster
- op: add
  path: /spec/params/5/default
  value: enterprise-contract-service/default

# Remove releaseServiceConfig pipeline param (index 3 before any other removes)
- op: remove
  path: /spec/params/3

# Remove releasePlanAdmission pipeline param (still at index 2 after above)
- op: remove
  path: /spec/params/2

# Remove releaseServiceConfig from collect-data task params (tasks/1, before tasks/0 is removed).
# Task 1 (collect-data) params:
#   0: release, 1: releasePlan, 2: releasePlanAdmission, 3: releaseServiceConfig, ...
- op: remove
  path: /spec/tasks/1/params/3

# Remove releasePlanAdmission from collect-data (now at index 2)
- op: remove
  path: /spec/tasks/1/params/2

# Remove verify-access-to-resources entirely — it exists solely to verify RPA/RSC
# access, which is irrelevant on the Fedora cluster (no RPA). Its task definition
# still declares releasePlanAdmission and releaseServiceConfig as required params
# with no defaults, so Tekton validation would fail regardless.
- op: remove
  path: /spec/tasks/0
