---
# JSON 6902 patch for the push-to-external-registry pipeline.
#
# Upstream pipeline params (0-based indices used below):
#   0: release
#   1: releasePlan
#   2: releasePlanAdmission   ← kept; collect-data receives "" and skips gracefully
#   3: releaseServiceConfig   ← kept; collect-data receives "" and skips gracefully
#   4: snapshot
#   5: enterpriseContractPolicy
#   6: enterpriseContractExtraRuleData
#   7: verify_ec_task_git_revision
#   8: taskGitUrl
#   9: taskGitRevision
#  10: ociStorage
#
# Upstream pipeline tasks (0-based indices used below):
#   0: verify-access-to-resources  ← removed entirely (requires RPA/RSC with no defaults)
#   1: collect-data
#   ...
#
# Operations are ordered so that:
#   1. Default-setting ops run before pipeline param removes (index shifts).
#   2. collect-data runAfter and tasks/0 removal run last.

# Use our trusted-artifacts storage
- op: replace
  path: /spec/params/10/default
  value: quay.io/foreman/konflux-ci/trusted-artifacts

# Tasks must match the development branch since the pipeline is sourced from there
- op: add
  path: /spec/params/9/default
  value: development

# Pin the EC/conforma task to main
- op: add
  path: /spec/params/7/default
  value: main

# Default EC policy for the Fedora cluster
- op: add
  path: /spec/params/5/default
  value: enterprise-contract-service/default

# Default releasePlanAdmission and releaseServiceConfig to empty — our custom
# collect-data task skips fetching those CRs when the values are empty.
- op: add
  path: /spec/params/2/default
  value: ""

- op: add
  path: /spec/params/3/default
  value: ""

# Override only collect-data to use the Foreman custom task, which makes
# releasePlanAdmission and releaseServiceConfig optional. All other tasks
# continue to resolve from the upstream catalog via $(params.taskGitUrl).
- op: replace
  path: /spec/tasks/1/taskRef
  value:
    resolver: git
    params:
      - name: url
        value: https://github.com/theforeman/theforeman-rel-eng-konflux.git
      - name: revision
        value: develop
      - name: pathInRepo
        value: tekton-catalog/tasks/collect-data/collect-data.yaml

# Remove collect-data's runAfter dependency so the DAG stays valid after
# verify-access-to-resources is removed.
- op: remove
  path: /spec/tasks/1/runAfter

# Remove verify-access-to-resources entirely — its task definition requires
# releasePlanAdmission and releaseServiceConfig with no defaults and cannot
# be patched without maintaining a custom copy.
- op: remove
  path: /spec/tasks/0
